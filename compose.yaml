services:
  db:
    image: mariadb:11.8
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: reservas
      MARIADB_USER: reservas
      MARIADB_PASSWORD: reservaspass
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    network_mode: host
    environment:
      RESERVAS_DB_HOST: 127.0.0.1
      RESERVAS_DB_USUARIO: reservas
      RESERVAS_DB_CLAVE: reservaspass
      RESERVAS_DB_NOMBRE: reservas
      RESERVAS_DB_PUERTO: "3306"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data: